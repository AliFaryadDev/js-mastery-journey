<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      background-color: #f6dcdc;
    }
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    #loginCard{
      width: 30%;
      height: 100vh;
      background-color: gray;
      position: fixed;
      right: -500px;
      top: 0;
      transition: right 0.2s ease;
    }
    header{
      display: flex;
      margin-top: 100px;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
    }
    form{
      display: flex;
      flex-direction: column;
      padding: 30px;
      gap: 30px;
    }
    #loginInput{
      display: flex;
      flex-direction: column;
    }
    .loginBtn{
      background-color: blue;
      color: white;
      font-size: 16px;
      border: none;
    }
    .loginBtn, #loginInput input{
      padding: 5px 0;
    }
    #loginPara{
      display: flex;
    }
    #loginPara p{
      font-size: 15px;
    }
    .loginBtnOne{
      border-radius: 20px;
      margin: 30px 30px;
      padding: 20px;
    }
    .showCard{
      right: 0 !important; 
    }
  </style>
</head>
<body>
  <button class="loginBtn loginBtnOne">
    Create an account
  </button>
  <div id="loginCard">
    <button id="closeBtn">&#10005;</button>
    <header>
      <h1>Login</h1>
      <p>Use email, instead</p>
    </header>
    <main>
      <form action="">
       <div id="loginInput">
         <label for="mobileNum">Mobile Number *</label>
         <input type="number">
       </div>
      <button class="loginBtn">
           Login
      </button>
      <div id="loginPara">
        <p>Don't have an account? <a href="#">Create an account</a></p>
      </div>
      
      </form>
    </main>
    
  </div>
  <script>
    let closeBtn = document.querySelector('#closeBtn');
    let loginCard = document.querySelector('#loginCard');
    let loginBtnOne = document.querySelector('.loginBtnOne');
    loginBtnOne.addEventListener('click', ()=>{
      loginCard.classList.add('showCard');
    });
    closeBtn.addEventListener('click', ()=>{
       loginCard.classList.remove('showCard');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM | Class List</title>
  <style>
    body {
      background: #F1F5F9;;
    }
    .paraOne{
      background: yellow;
      color: red;
    }
    p {
      border: 2px solid black;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
    }
    button {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:active {
  transform: scale(0.90);
  box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.20);
    }
    #btnOne{
      background: blue;
      padding: 10px;
      color: white;
      border-radius: 10px;
      border: none;
    }
    #btnTwo{
      background: red;
      padding: 10px;
      color: white;
      border-radius: 10px;
      border: none;
    }
  </style>
</head>
<body>
 <p>
   "The strength you are searching for is already within you."

<span>BELIEVE IN YOURSELF.</span>
</p>
<div id="styleBtn">
  <button id = "btnOne">Add Style</button>
<button id="btnTwo">Remove Style</button>
</div>



  <script>
   paraOne = document.querySelector('p');
   btnOne = document.querySelector('#btnOne');
   btnOne.addEventListener('click', ()=>{
      paraOne.classList.add('paraOne');
   });
    btnTwo = document.querySelector('#btnTwo');
    btnTwo.addEventListener('click',()=>{
      paraOne.classList.remove('paraOne');
    })
  </script>
</body>
</html>

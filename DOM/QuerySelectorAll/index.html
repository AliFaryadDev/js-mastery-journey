<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM_Selection</title>
</head>
<body>
 <h3>Hello</h3>
 <h3>How are you</h3>
 <h3>I'm Ali</h3>
  <script>
    headingThree = document.querySelectorAll('h3');
    for (i = 0; i < headingThree.length; i++){
    console.log(headingThree[i].innerText);
    }
  </script>
</body>
</html>
